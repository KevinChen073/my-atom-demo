name: Azure demo image smoke

on:
  push:
    branches: [deploy/azure-preparation]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-azure.txt pytest httpx
      - run: python -m pytest -q tests/test_business_data_check.py tests/test_azure_demo_runtime.py tests/test_azure_sql_adapter.py tests/test_azure_artifacts.py tests/test_azure_preview_files.py tests/test_azure_sql_migration.py tests/test_decision_idempotency.py tests/test_invite_access.py tests/test_shared_origin_preview.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm test
        working-directory: web
      - run: docker build -t myatom-demo-smoke .
      - name: Verify health-only default container
        run: |
          docker run -d --name myatom-demo-smoke -p 18000:8000 myatom-demo-smoke
          trap 'docker rm -f myatom-demo-smoke' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/api/health > /tmp/myatom-health.json; then break; fi
            sleep 2
          done
          python -c 'import json; assert json.load(open("/tmp/myatom-health.json"))["app_env"] == "container_smoke"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18000/)" = "503"
      - name: Publish verified image to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image=ghcr.io/kevinchen073/my-atom-demo
          docker tag myatom-demo-smoke "$image:smoke-${GITHUB_SHA}"
          docker tag myatom-demo-smoke "$image:smoke"
          docker push "$image:smoke-${GITHUB_SHA}"
          docker push "$image:smoke"
