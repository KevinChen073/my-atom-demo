name: PostgreSQL persistence smoke

on:
  push:
    branches: [deploy/azure-preparation]
  workflow_dispatch:

jobs:
  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: myatom_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-smoke-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d myatom_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URL: postgresql://postgres:ephemeral-smoke-only@127.0.0.1:5432/myatom_test
      TEST_POSTGRES_ADMIN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-azure.txt
      - run: python -m pytest -q tests/test_postgres_platform.py
